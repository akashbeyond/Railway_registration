{% extends "base.html" %}
{% block title %}Login - RailBook{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" maxlength="254" required autocomplete="email">
  </label>
  <label>Password
    <input type="password" name="password" maxlength="128" required autocomplete="current-password">
  </label>
  <button type="submit">Login</button>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>
{% endblock %}
